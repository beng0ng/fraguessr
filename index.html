        <circle class="b-puff" cx="18" cy="3" r="1" fill="var(--accent)"/>
        <circle class="b-puff" cx="20.5" cy="4.6" r=".75" fill="var(--accent)" style="--o:.7"/>
        <circle class="b-puff" cx="20.6" cy="1.6" r=".6" fill="var(--accent)" style="--o:.5"/>
      </svg>
    </div>
    <h1 class="in-word" id="in-word" aria-label="Fraguessr"><span aria-hidden="true" style="display:contents"><span style="--i:0">F</span><span style="--i:1">r</span><span style="--i:2">a</span><span style="--i:3">g</span><span style="--i:4">u</span><span style="--i:5">e</span><span style="--i:6">s</span><span style="--i:7">s</span><span style="--i:8">r</span></span></h1>
    <p class="in-tag">Name the notes in today’s perfume, from every corner of the world.</p>
    <div class="in-reel" aria-hidden="true"><div class="in-reel-track"></div></div>
    <button class="in-card in-daily" data-go="play">
      <span class="in-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="9" width="12" height="12" rx="2.5"/><path d="M10 9V6h4v3M9 3h6"/><path d="M9 15h6" opacity=".6"/></svg></span>
      <span class="in-txt"><span class="mono"><span class="in-live"></span><span data-in="label">Today’s scent</span></span><b data-in="name">Today’s scent</b><span data-in="line">Find its notes with five chances.</span></span>
      <span class="in-go"><span data-in="cta">Play today’s scent</span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg></span>
    </button>
    <div class="in-alts"><button type="button" class="in-alt" data-go="atlas">Wander the atlas of 354 notes</button><span class="in-dot" aria-hidden="true">·</span><button type="button" class="in-alt" data-go="friends">Play live with friends</button></div>
  </div>
  <nav class="in-foot" aria-label="About Fraguessr"><a href="about.html">About</a><a href="about.html#privacy">Privacy</a></nav>
</div>

<noscript><p class="noscript">Fraguessr is a game that runs in your browser, so it needs JavaScript. Turn it on for this site and reload the page to play.</p></noscript>
<script>if('serviceWorker'in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 2.5h5v3h-5z" fill="currentColor"/><path d="M10.5 5.5h3v2h-3z" stroke="currentColor" stroke-width="1.3"/><rect x="4.5" y="7.5" width="15" height="14" rx="4" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="14.5" r="3.6" fill="var(--accent)"/><path d="M12 10.9c-1.3 1-1.9 2.2-1.9 3.6s.6 2.6 1.9 3.6M8.4 14.5h7.2" stroke="var(--background)" stroke-width="1"/><circle cx="18" cy="3" r="1" fill="var(--accent)"/><circle cx="20.5" cy="4.6" r=".75" fill="var(--accent)" opacity=".7"/><circle cx="20.6" cy="1.6" r=".6" fill="var(--accent)" opacity=".5"/></svg>
      <h1>Fraguessr</h1>
    </div>
    <nav class="modes" data-mode="play" role="tablist" aria-label="Mode">
      <i class="modes-pill" aria-hidden="true"></i>
      <button role="tab" id="play" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h5v3h-5zM10.5 5.5v2.2M13.5 5.5v2.2"/><rect x="5" y="7.7" width="14" height="13.8" rx="3.2"/><path d="M8.5 14.5c1.2-1 2.4-1 3.5 0s2.3 1 3.5 0"/></svg><span>Daily <span class="mx">Scent</span></span><b class="modes-live" aria-hidden="true"></b></button>
      <button role="tab" id="m-explore" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5h17M3.5 14.5h17M12 3c-2.6 2.6-3.6 5.6-3.6 9s1 6.4 3.6 9M12 3c2.6 2.6 3.6 5.6 3.6 9s-1 6.4-3.6 9"/></svg><span><span class="mx">Scent </span>Atlas</span></button>
    </nav>
    <div class="top-end">
    <div class="spacer"></div>
    <button class="col-tab" id="tab-col" aria-pressed="false" title="Your collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Collection</span><b class="mono" id="count-col"></b></button>
    <button class="search-trigger" id="open-search" aria-label="Search ingredients and fragrances">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search</span><kbd>⌘K</kbd>
    </button>
    <button class="btn icon ghost top-ic" id="open-help" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg><span>How to play</span></button>
    <button class="btn icon ghost top-ic" id="open-stats" aria-label="Your stats" title="Your stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5"/></svg><span>Stats</span></button>
    <button class="btn ghost acct-btn" id="open-account" hidden aria-label="Sign in or create an account" title="Sign in"></button>
    <div class="theme-seg" id="theme" role="radiogroup" aria-label="Colour theme" data-v="auto">
      <i class="theme-pill" aria-hidden="true"></i>
      <button role="radio" data-theme-v="light" aria-checked="false" aria-label="Light mode" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span></button>
      <button role="radio" data-theme-v="dark" aria-checked="false" aria-label="Dark mode" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg><span>Dark</span></button>
      <button role="radio" data-theme-v="auto" aria-checked="true" aria-label="Match system" title="Match system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>Auto</span></button>
    </div>
    </div>
  </header>
  <div class="loginbar" id="loginbar" role="region" aria-label="Your streak and discovery set" hidden></div>

  <main class="main">
    <section class="stage" id="stage" aria-label="Interactive globe">
      <canvas class="sky" id="sky" aria-hidden="true"></canvas>
      <div class="globe-wrap" id="globe-wrap"><canvas id="globe"></canvas></div>
      <canvas class="world" id="world" aria-hidden="true"></canvas>
      <canvas class="world" id="dots" aria-hidden="true"></canvas>
      <div class="labels" id="labels"></div>
      <div class="tooltip" id="tooltip"></div>
      <div class="overlay-tl">
        <span class="badge glass mono hint" id="hint">Drag to spin · Scroll to zoom · Tap a dot</span>
      </div>
      <div class="overlay-tr regions-wrap">
        <div class="glass regions" id="regions"></div>
      </div>
      <div class="overlay-bl" id="families"></div>
      <div class="overlay-br">
        <div class="glass btn-group">
          <button class="btn icon" id="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="zoom-meter" id="zoom-meter">1.0×</div>
          <button class="btn icon" id="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <button class="btn icon" id="reset" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        </div>
      </div>
      <div class="journey" id="journey"><div class="jr-tray glass"></div><div class="jr-mix"></div></div>
      <div class="caption glass" id="caption"></div>
    </section>

    <aside class="panel">
      <div class="panel-head">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tab-ing" aria-selected="true">Ingredients <span class="mono" id="count-ing"></span></button>
          <button class="tab" role="tab" id="tab-frag" aria-selected="false">Fragrances <span class="mono" id="count-frag"></span></button>
        </div>
        <input class="input" id="filter" placeholder="Filter ingredients…" autocomplete="off">
      </div>
      <div class="views">
        <div class="view" id="view-list"></div>
        <div class="view off-right" id="view-detail"></div>
        <div class="view off-right" id="view-game"></div>
      </div>
    </aside>
  </main>
</div>

<div class="cmdk-backdrop" id="cmdk" inert>
  <div class="cmdk" role="dialog" aria-label="Search">
    <div class="cmdk-input">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="muted"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="cmdk-input" placeholder="Type an ingredient, perfume, house or country…" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>↵</kbd> to open</span></div>
  </div>
</div>

<script type="module" src="app.js?v=7100345798"></script>

</body>
</html>
